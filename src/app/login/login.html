<div class="login-page">

  <div class="login-card">

    <div class="login-header">

      <h1>Welcome back</h1>

      <p>
        Sign in to continue to your AI chat.
      </p>

    </div>


    <form
      (ngSubmit)="login()"
      #loginForm="ngForm"
    >

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          autocomplete="email"
          [disabled]="loading"
          required
        />

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          [disabled]="loading"
          required
        />

      </div>


      @if (errorMessage) {

        <div class="error-message">

          {{ errorMessage }}

        </div>

      }


      <button
        type="submit"
        class="login-button"
        [disabled]="loading"
      >

        @if (loading) {

          <span>
            Signing in...
          </span>

        } @else {

          <span>
            Sign in
          </span>

        }

      </button>

    </form>


    <div class="register-link">

      <span>
        Don't have an account?
      </span>

      <button
        type="button"
        (click)="goToRegister()"
        [disabled]="loading"
      >
        Create one
      </button>

    </div>

  </div>

</div>
